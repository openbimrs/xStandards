[workspace]
resolver = "3"
# One directory per crate; each standard is openbim-<x>, its short-name alias
# <x>, and the bindings openbim-<x>-wasm (npm) and openbim-<x>-py (PyPI).
members = ["crates/*"]

# Every crate keeps its own `version` (released independently by
# scripts/release-crate.py); everything else is shared.
[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["point-grey"]
repository = "https://github.com/openbimrs/xStandards"
homepage = "https://github.com/openbimrs/xStandards"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Standard names (XPlanung, XRechnung) are CamelCase prose, not code.
doc_markdown = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
