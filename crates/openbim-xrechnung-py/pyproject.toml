[build-system]
requires = ["maturin>=1.13,<2"]
build-backend = "maturin"

[project]
name = "openbim-xrechnung"
version = "0.1.0"
description = "German CIUS of the EN 16931 electronic invoice -- Python bindings for the openbim-xrechnung Rust crate."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["xrechnung", "egovernment", "openbim", "bim", "einvoice", "en16931"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Repository = "https://github.com/openbimrs/xStandards"

[tool.maturin]
module-name = "openbim_xrechnung"
# maturin moves pyproject.toml to the sdist root but leaves LICENSE in the
# crate directory, while PKG-INFO names it at the root; PyPI rejects such
# an sdist.
include = [{ path = "LICENSE", format = "sdist" }]
