[package]
name = "xplanung"
version = "0.1.0"
description = "XPlanung alias: re-exports openbim-xplanung."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/openbim-xplanung"
readme = "README.md"
keywords = ["openbim", "xplanung", "egovernment"]
categories = ["data-structures"]
include = ["src/**", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE"]

[dependencies]
# Exact pin prevents the alias and canonical package from exposing different
# versions of the same API in one dependency graph.
openbim-xplanung = { path = "../openbim-xplanung", version = "=0.1.0" }

[lints]
workspace = true
