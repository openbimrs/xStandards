[build-system]
requires = ["flit_core>=3.9,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "xplanung"
version = "0.1.0"
description = "XPlanung alias: re-exports openbim-xplanung."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
# Exact pin: the alias and the canonical package expose one API.
dependencies = ["openbim-xplanung==0.1.0"]
keywords = ["xplanung", "egovernment", "openbim", "bim", "planning", "gml"]
classifiers = ["License :: OSI Approved :: MIT License"]

[project.urls]
Repository = "https://github.com/openbimrs/xStandards"
