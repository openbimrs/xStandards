[package]
name = "openbim-xplanung-wasm"
version = "0.1.0"
description = "WebAssembly bindings for openbim-xplanung (XPlanung), published to npm as @openbim/xplanung."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["openbim", "xplanung", "egovernment", "wasm"]
categories = ["wasm"]
# npm-only: distributed as `@openbim/xplanung`.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openbim-xplanung = { path = "../openbim-xplanung", version = "0.1.0" }
wasm-bindgen = "=0.2.128"

[lints]
workspace = true
