[build-system]
requires = ["maturin>=1.13,<2"]
build-backend = "maturin"

[project]
name = "openbim-xtrasse"
version = "0.1.0"
description = "Geodata standard for planned line routes, built on XPlanung -- Python bindings for the openbim-xtrasse Rust crate."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["xtrasse", "egovernment", "openbim", "bim", "infrastructure", "gml"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Repository = "https://github.com/openbimrs/xStandards"

[tool.maturin]
module-name = "openbim_xtrasse"
# maturin moves pyproject.toml to the sdist root but leaves LICENSE in the
# crate directory, while PKG-INFO names it at the root; PyPI rejects such
# an sdist.
include = [{ path = "LICENSE", format = "sdist" }]
