[package]
name = "openbim-xtrasse-py"
version = "0.1.0"
description = "Python bindings for openbim-xtrasse (XTrasse), published to PyPI as openbim-xtrasse."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["openbim", "xtrasse", "egovernment", "python"]
categories = ["api-bindings"]
# Shipped as a wheel (maturin), not as a crate.
publish = false

[lib]
# Python imports the extension as `openbim_xtrasse`; `rlib` lets the Rust tests link
# the binding without an interpreter.
name = "openbim_xtrasse_py"
crate-type = ["cdylib", "rlib"]

[dependencies]
openbim-xtrasse = { path = "../openbim-xtrasse", version = "0.1.0" }
# abi3-py39: one wheel for CPython 3.9+. maturin sets
# PYO3_BUILD_EXTENSION_MODULE, so `cargo test --workspace` stays linkable.
pyo3 = { version = "=0.29.2", features = ["abi3-py39"] }

[lints]
workspace = true
