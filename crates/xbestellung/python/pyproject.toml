[build-system]
requires = ["flit_core>=3.9,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "xbestellung"
version = "0.1.0"
description = "XBestellung alias: re-exports openbim-xbestellung."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
# Exact pin: the alias and the canonical package expose one API.
dependencies = ["openbim-xbestellung==0.1.0"]
keywords = ["xbestellung", "egovernment", "openbim", "bim", "procurement", "order"]
classifiers = ["License :: OSI Approved :: MIT License"]

[project.urls]
Repository = "https://github.com/openbimrs/xStandards"
