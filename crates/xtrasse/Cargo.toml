[package]
name = "xtrasse"
version = "0.1.0"
description = "XTrasse alias: re-exports openbim-xtrasse."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/openbim-xtrasse"
readme = "README.md"
keywords = ["openbim", "xtrasse", "egovernment"]
categories = ["data-structures"]
include = ["src/**", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE"]

[dependencies]
# Exact pin prevents the alias and canonical package from exposing different
# versions of the same API in one dependency graph.
openbim-xtrasse = { path = "../openbim-xtrasse", version = "=0.1.0" }

[lints]
workspace = true
