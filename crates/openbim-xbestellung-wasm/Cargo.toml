[package]
name = "openbim-xbestellung-wasm"
version = "0.1.0"
description = "WebAssembly bindings for openbim-xbestellung (XBestellung), published to npm as @openbim/xbestellung."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["openbim", "xbestellung", "egovernment", "wasm"]
categories = ["wasm"]
# npm-only: distributed as `@openbim/xbestellung`.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openbim-xbestellung = { path = "../openbim-xbestellung", version = "0.1.0" }
wasm-bindgen = "=0.2.128"

[lints]
workspace = true
