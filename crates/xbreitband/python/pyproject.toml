[build-system]
requires = ["flit_core>=3.9,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "xbreitband"
version = "0.1.0"
description = "XBreitband alias: re-exports openbim-xbreitband."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
# Exact pin: the alias and the canonical package expose one API.
dependencies = ["openbim-xbreitband==0.1.0"]
keywords = ["xbreitband", "egovernment", "openbim", "bim", "broadband", "permit"]
classifiers = ["License :: OSI Approved :: MIT License"]

[project.urls]
Repository = "https://github.com/openbimrs/xStandards"
