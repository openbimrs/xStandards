[package]
name = "openbim-xbreitband-wasm"
version = "0.1.0"
description = "WebAssembly bindings for openbim-xbreitband (XBreitband), published to npm as @openbim/xbreitband."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["openbim", "xbreitband", "egovernment", "wasm"]
categories = ["wasm"]
# npm-only: distributed as `@openbim/xbreitband`.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openbim-xbreitband = { path = "../openbim-xbreitband", version = "0.1.0" }
wasm-bindgen = "=0.2.128"

[lints]
workspace = true
