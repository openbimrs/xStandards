[build-system]
requires = ["flit_core>=3.9,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "xbau"
version = "0.1.0"
description = "XBau alias: re-exports openbim-xbau."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
# Exact pin: the alias and the canonical package expose one API.
dependencies = ["openbim-xbau==0.1.0"]
keywords = ["xbau", "egovernment", "openbim", "bim", "construction", "permit"]
classifiers = ["License :: OSI Approved :: MIT License"]

[project.urls]
Repository = "https://github.com/openbimrs/xStandards"
