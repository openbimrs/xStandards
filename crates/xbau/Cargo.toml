[package]
name = "xbau"
version = "0.1.0"
description = "XBau alias: re-exports openbim-xbau."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/openbim-xbau"
readme = "README.md"
keywords = ["openbim", "xbau", "egovernment"]
categories = ["data-structures"]
include = ["src/**", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE"]

[dependencies]
# Exact pin prevents the alias and canonical package from exposing different
# versions of the same API in one dependency graph.
openbim-xbau = { path = "../openbim-xbau", version = "=0.1.0" }

[lints]
workspace = true
