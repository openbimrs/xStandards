# Publish one crate to its registry when its release tag is pushed. Ported
# from openbimrs/ifcx. `scripts/release-crate.py <crate> --publish` creates
# and pushes the tag; see CONTRIBUTING.md#releasing-a-crate.
#
#   <crate>-v<version>  ->  crates.io  for openbim-<x> and the alias <x>
#                           npm        for openbim-<x>-wasm  (@openbim/<x>)
#                           PyPI       for openbim-<x>-py    (openbim-<x>)
#   <x>-npm-v<version>  ->  npm        short-name alias <x> of @openbim/<x>
#   <x>-py-v<version>   ->  PyPI       short-name alias <x> of openbim-<x>
#
# An alias pins its canonical package exactly; release that one first.
#
# Every registry is published by trusted publishing (OIDC). Each publish job
# runs in the environment named after its registry (`crates.io`,
# `npmjs.com`, `pypi.org`), and each registry trusts exactly this file name
# and that environment, so renaming either breaks publishing until the
# registry settings follow. The environments require a maintainer's
# approval and accept only `main` and release tags.
#
# First publishes: crates.io and npm accept a trusted publisher only for a
# package that already exists, so each job falls back to a long-lived token
# in its environment (`CARGO_REGISTRY_TOKEN` in `crates.io`, `NPM_TOKEN` in
# `npmjs.com`) when trusted publishing is refused. PyPI accepts a "pending"
# trusted publisher for a project that does not exist yet; `PYPI_API_TOKEN`
# in `pypi.org` is an optional fallback all the same. Delete each token once
# the packages it covers trust this workflow.
#
# Run it by hand (Actions -> Release -> Run workflow) with a tag name to
# rehearse a release: everything is built and tested, nothing is published.
# The gate itself is CI's: the plan job requires CI to have passed on the
# commit rather than running scripts/gate.sh a second time.
name: Release

on:
  push:
    tags:
      - "*-v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to rehearse, e.g. openbim-xplanung-py-v0.1.0 (builds and tests only)"
        required: true

# Nothing here may be cancelled halfway: a crate published without its npm
# twin is a split release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan and gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # read CI's verdict on the tagged commit
    outputs:
      crate: ${{ steps.plan.outputs.crate }}
      version: ${{ steps.plan.outputs.version }}
      crates_io: ${{ steps.plan.outputs.crates_io }}
      npm: ${{ steps.plan.outputs.npm }}
      pypi: ${{ steps.plan.outputs.pypi }}
      dir: ${{ steps.plan.outputs.dir }}
      package: ${{ steps.plan.outputs.package }}
      kind: ${{ steps.plan.outputs.kind }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require the tag to be on main
        # A tag on an unmerged branch would publish code main never gated.
        # A rehearsal checks the dispatched ref the same way.
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - name: Resolve registries
        id: plan
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: python3 scripts/release-crate.py "$TAG" --plan | tee -a "$GITHUB_OUTPUT"
      - name: Require CI to have passed on this commit
        # The full gate (scripts/gate.sh) already runs in CI on every push,
        # including this tag's, on this exact commit -- running it again here
        # cost 13 minutes and proved nothing new. Instead, wait for a CI run
        # of `.github/workflows/ci.yml` on this commit and require its
        # verdict. Only `push` runs count: they test the commit itself, while
        # a pull_request run tests a merge with its base. The commit is on
        # main (checked above), so CI ran main's workflow and gate.sh.
        # Re-running a failed CI run and then this job picks up the new result.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 120); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push" \
              --jq '.workflow_runs[] | "\(.id) \(.status) \(.conclusion)"')"
            if grep -q ' completed success$' <<<"$runs"; then
              echo "CI passed on $GITHUB_SHA:"; echo "$runs"; exit 0
            fi
            if [ -n "$runs" ] && ! grep -qv ' completed ' <<<"$runs"; then
              echo "::error::CI did not pass on $GITHUB_SHA; re-run it, then re-run this workflow"
              echo "$runs"; exit 1
            fi
            echo "waiting for CI on $GITHUB_SHA: ${runs:-no run yet}"
            sleep 30
          done
          echo "::error::no finished CI run on $GITHUB_SHA after 60 minutes"; exit 1

  crates-io:
    name: Publish to crates.io
    needs: plan
    if: needs.plan.outputs.crates_io == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: crates.io
      url: https://crates.io/crates/${{ needs.plan.outputs.crate }}/${{ needs.plan.outputs.version }}
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing (OIDC)
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - name: Authenticate with crates.io (trusted publishing)
        # A short-lived token, revoked when the job ends. crates.io issues
        # it when ANY crate trusts this workflow and the `crates.io`
        # environment, but it only works for those crates, so a token can
        # exist and still be refused for the crate being released.
        id: auth
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish
        # --publish-here skips a version that is already live, so the
        # fallback retry with the long-lived secret is safe: it can only
        # publish what the trusted-publishing attempt did not. The fallback
        # goes away when CARGO_REGISTRY_TOKEN is deleted.
        env:
          CRATE: ${{ needs.plan.outputs.crate }}
          OIDC_TOKEN: ${{ steps.auth.outputs.token }}
          FALLBACK_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$OIDC_TOKEN" ] && CARGO_REGISTRY_TOKEN="$OIDC_TOKEN" \
              python3 scripts/release-crate.py "$CRATE" --publish-here; then
            exit 0
          fi
          if [ -z "$FALLBACK_TOKEN" ]; then
            # A first release published by hand (`--publish --local`) also
            # pushes the tag; without a token this still succeeds when the
            # version is already live, and fails otherwise.
            if CARGO_REGISTRY_TOKEN= python3 scripts/release-crate.py "$CRATE" --publish-here; then
              exit 0
            fi
            echo "::error::trusted publishing failed for $CRATE and no CARGO_REGISTRY_TOKEN fallback is set"
            exit 1
          fi
          echo "::warning::$CRATE is not publishable via crates.io trusted publishing; used CARGO_REGISTRY_TOKEN"
          CARGO_REGISTRY_TOKEN="$FALLBACK_TOKEN" python3 scripts/release-crate.py "$CRATE" --publish-here

  npm:
    name: Publish to npm
    needs: plan
    if: needs.plan.outputs.npm == 'true'
    runs-on: ubuntu-latest
    environment:
      name: npmjs.com
      url: https://www.npmjs.com/package/${{ needs.plan.outputs.package }}/v/${{ needs.plan.outputs.version }}
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          targets: wasm32-unknown-unknown
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never cache in a release build
      - name: Install npm with trusted publishing
        # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
        run: npm install --global npm@^11.5.1 && npm --version
      - name: Install wasm-bindgen CLI
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: wasm-bindgen-cli@0.2.128
      - name: Build and test the package
        env:
          CRATE: ${{ needs.plan.outputs.crate }}
          KIND: ${{ needs.plan.outputs.kind }}
          ALIAS: ${{ needs.plan.outputs.package }}
        run: |
          if [ "$KIND" = alias ]; then
            # Tested against the pinned @openbim/<x> as published.
            scripts/build-npm-alias.sh "$ALIAS" "$RUNNER_TEMP/pkg"
          else
            scripts/build-npm-package.sh "$CRATE" "$RUNNER_TEMP/pkg"
          fi
      - name: Rehearse publish
        # npm 11 refuses even a dry run over a live version, so rehearsing
        # an already-published tag packs the tarball instead.
        if: github.event_name != 'push'
        env:
          NAME: ${{ needs.plan.outputs.package }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          cd "$RUNNER_TEMP/pkg"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm; packing instead"
            npm pack --dry-run
          else
            npm publish --dry-run --access public
          fi
      - name: Publish
        # npm tries trusted publishing (OIDC) first and falls back to
        # NODE_AUTH_TOKEN, which is empty unless the environment holds
        # NPM_TOKEN for a first publish.
        if: github.event_name == 'push'
        env:
          NAME: ${{ needs.plan.outputs.package }}
          VERSION: ${{ needs.plan.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/pkg"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm"
          else
            npm publish --access public --provenance
          fi

  wheels:
    name: Wheel (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.pypi == 'true' && needs.plan.outputs.kind == 'binding'
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: "2_28" }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64, manylinux: "2_28" }
          - { name: macos-universal2, os: macos-15, target: universal2-apple-darwin }
          - { name: windows-x64, os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: "v1.13.3"
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --locked --out dist --manifest-path ${{ needs.plan.outputs.dir }}/Cargo.toml
      - name: Test the built wheel
        # Installed outside the source tree, so the suite imports the wheel.
        shell: bash
        env:
          TESTS: ${{ github.workspace }}/${{ needs.plan.outputs.dir }}/tests/python
        run: |
          python -m pip install --quiet dist/*.whl
          cd "$RUNNER_TEMP"
          python -m unittest discover -s "$TESTS" -t "$TESTS"
      - name: Upload wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    needs: plan
    if: needs.plan.outputs.pypi == 'true' && needs.plan.outputs.kind == 'binding'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: "v1.13.3"
          command: sdist
          args: --out dist --manifest-path ${{ needs.plan.outputs.dir }}/Cargo.toml
      - name: Upload sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  alias-dist:
    name: Alias distributions
    needs: plan
    if: needs.plan.outputs.pypi == 'true' && needs.plan.outputs.kind == 'alias'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        env:
          DIR: ${{ needs.plan.outputs.dir }}
        run: |
          python -m pip install --quiet "build==1.2.2.post1"
          python -m build --outdir dist "$DIR"
      - name: Test against the published canonical package
        # The alias pins openbim-<x> exactly, which must already be on PyPI.
        env:
          ALIAS: ${{ needs.plan.outputs.package }}
        run: |
          python -m pip install --quiet dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "import $ALIAS, openbim_$ALIAS; assert $ALIAS.STANDARD_NAME == openbim_$ALIAS.STANDARD_NAME; print($ALIAS.STANDARD_NAME, $ALIAS.__version__)"
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alias-dist
          path: dist/*
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: [plan, wheels, sdist, alias-dist]
    # wheels/sdist run for a binding, alias-dist for an alias; the others
    # are skipped, which must not skip this job.
    if: >-
      !cancelled() && github.event_name == 'push'
      && needs.plan.outputs.pypi == 'true'
      && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    environment:
      name: pypi.org
      url: https://pypi.org/project/${{ needs.plan.outputs.package }}/${{ needs.plan.outputs.version }}/
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing (OIDC)
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: List distributions
        run: ls -la dist
      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true
          # Empty unless the environment holds PYPI_API_TOKEN; empty means
          # trusted publishing.
          password: ${{ secrets.PYPI_API_TOKEN }}
